<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Visual review</title>
        <link rel="icon" href="icon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="icon.png" />
        <link rel="manifest" href="manifest.webmanifest" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="Visual review" />
        <link rel="stylesheet" href="review.css" />
        <script type="module" src="review.js"></script>
    </head>
    <body>
        <header id="top">
            <h1><button type="button" id="home" class="link">Visual review</button></h1>
            <nav id="crumbs" aria-label="Where you are" hidden>
                <label class="picker"
                    ><span>Target</span
                    ><select id="pick-target"></select
                ></label>
                <button type="button" id="prev-project" aria-keyshortcuts="[" aria-label="Previous project">
                    &lt;
                </button>
                <label class="picker"
                    ><span>Project</span
                    ><select id="pick-project"></select
                ></label>
                <button type="button" id="next-project" aria-keyshortcuts="]" aria-label="Next project">&gt;</button>
                <button type="button" id="to-grid" class="link crumb" aria-keyshortcuts="Escape" hidden>Grid</button>
                <button type="button" id="to-item" class="link crumb" hidden></button>
            </nav>
            <span id="finish-slot"></span>
            <button type="button" id="keys-button" aria-keyshortcuts="?">
                <span class="keys-word">Keys</span> <kbd aria-hidden="true">?</kbd>
            </button>
            <button type="button" id="copy-link">Copy link</button>
        </header>
        <div id="bar" role="region" aria-label="Tools"></div>
        <div id="status-row" role="region" aria-label="Messages">
            <span id="status" role="status"></span><span id="elapsed" aria-hidden="true"></span
            ><span id="alert" role="alert"></span
            ><button type="button" id="status-more" class="link" hidden>More</button>
        </div>
        <main id="app" tabindex="-1"><p>Loading...</p></main>
    </body>
</html>
