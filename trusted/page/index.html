<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Visual review</title>
        <link rel="icon" href="/icon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/icon.png" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="Visual review" />
        <link rel="stylesheet" href="/page.css" />
        <script type="module" src="/app.js"></script>
    </head>
    <body>
        <header id="top">
            <span class="brand">Visual review</span><span class="repo" id="repo"></span>
            <span class="tabs" id="tabs"></span><span id="newcap-slot"></span>
            <span class="grow"></span>
            <span id="status-slot"></span><span id="frame-slot"></span>
        </header>
        <div id="screens">
            <nav id="changes" class="pane" aria-label="Changes">
                <div id="rail-c"></div>
                <div class="pane-head">
                    <div class="pane-title"><span class="grow">Changes</span><span id="hide-c"></span></div>
                    <input
                        type="search"
                        id="chg-find"
                        data-act="find"
                        data-key="/"
                        data-zone="changes-head"
                        data-find="Find a change: number, title, branch, author"
                        aria-label="Find a change: number, title, branch, author"
                        autocomplete="off"
                    />
                    <div class="row-ctrl small">
                        <span id="chg-next"></span><span id="chg-sort"></span
                        ><span class="grow muted" id="chg-count"></span>
                    </div>
                </div>
                <div class="list" id="chg-list" tabindex="0" role="listbox" aria-label="Changes"></div>
            </nav>
            <section id="snaps" class="pane" aria-label="Snapshots">
                <div id="rail-s"></div>
                <div class="pane-head" id="snaps-head"></div>
                <div class="banner" id="snap-banner" role="status" hidden></div>
                <div class="banner" id="snap-renderer" role="status" hidden></div>
                <div class="banner" id="snap-stale" role="status" hidden></div>
                <div class="list" id="snap-list" tabindex="0" role="listbox" aria-label="Snapshots"></div>
            </section>
            <main class="viewer" id="viewer" tabindex="-1" aria-label="Viewer"></main>
            <nav id="bl-proj" class="pane bl" aria-label="Projects">
                <div id="rail-p"></div>
                <div class="pane-head">
                    <div class="pane-title"><span class="grow">Projects</span><span id="hide-p"></span></div>
                    <label class="small muted">Baselines of <span id="bl-ref-slot"></span></label>
                </div>
                <div class="list tree" id="bl-tree" tabindex="0" role="listbox" aria-label="Projects"></div>
            </nav>
            <section id="bl-list-pane" class="pane bl" aria-label="Baselines">
                <div id="rail-b"></div>
                <div class="pane-head">
                    <div class="pane-title" id="bl-title"></div>
                    <input
                        type="search"
                        id="bl-find"
                        data-act="find"
                        data-key="/"
                        data-zone="snaps-head"
                        data-find="Find a story, or a number"
                        aria-label="Find a story, or a number"
                        autocomplete="off"
                    />
                    <div class="row-ctrl" id="bl-ctrl"></div>
                </div>
                <div class="list" id="bl-list" tabindex="0" role="listbox" aria-label="Baselines"></div>
            </section>
            <main class="viewer bl" id="bl-viewer" tabindex="-1" aria-label="Baseline viewer"></main>
        </div>
        <div id="scr-captures" hidden>
            <nav id="cap-list" class="pane" aria-label="Captures">
                <div class="pane-head">
                    <div class="pane-title"><span class="grow">Captures</span><span id="cap-new"></span></div>
                </div>
                <div class="list" id="cap-rows" tabindex="0" role="listbox" aria-label="Captures"></div>
            </nav>
            <main class="capdetail" id="cap-detail" aria-label="Capture"></main>
        </div>
        <footer id="msgline">
            <span class="t" id="msg-t" role="status"></span><span id="msg-x"></span><span id="msg-btn"></span>
        </footer>
        <dialog id="dlg"></dialog>
    </body>
</html>
