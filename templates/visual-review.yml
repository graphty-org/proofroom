# Generated by proofroom init. `proofroom init --force` rewrites
# this file; change visual-review.config.json rather than this file where you can.
#
# Visual review. On every pull request and every push to __BRANCH__, each Storybook named in
# visual-review.config.json is built, every story is screenshot and compared with its baseline PNG
# in git, and the results are uploaded as the artifact "visual-<project>-<attempt>" for
# `proofroom serve`, which finds this workflow by its file name (the config's "workflow") and
# the capture jobs by their names, "visual (<project>)". Each capture job's "Capture and compare"
# step fails when a snapshot did not pass, and the job carries on (continue-on-error), so a
# difference waiting for review never fails the run; on a pull request the "Visual gate" job fails
# while any difference is not accepted, so make "Visual gate" a required status check (Settings,
# Branches or Rulesets).
#
# The review page's New capture asks for a capture on CI by dispatching this workflow on a pull
# request's branch, with the pull request (`pr`), the head it showed (`ref`) and a request id
# (`request`) the run's name carries, so the page finds the run it started. Such a run captures the
# pull request's merge with its base branch, as its own run does, and stops if the pull request has
# moved past that head. By hand:
#   gh workflow run visual-review.yml --ref <branch>
# and add -f projects="web,charts" or -f stories="button--" to capture only those.

name: Visual review
run-name: ${{ inputs.request && format('Visual review, capture request {0}', inputs.request) || '' }}

on:
    pull_request:
    push:
        branches: [__BRANCH__]
    workflow_dispatch:
        inputs:
            ref:
                description: "The commit (or branch) to capture (default: the branch it runs on)"
                required: false
                type: string
                default: ""
            pr:
                description: "The pull request to capture, by number: its merge at the head `ref` names (default: none)"
                required: false
                type: string
                default: ""
            projects:
                description: "The projects to capture, separated by spaces or commas (default: every one)"
                required: false
                type: string
                default: ""
            stories:
                description: "Only the stories whose id starts with one of these, separated by commas (default: every one)"
                required: false
                type: string
                default: ""
            request:
                description: "The review page's id for this capture, put in the run's name"
                required: false
                type: string
                default: ""

permissions:
    contents: read

env:
    # A failed Actions cache restore otherwise holds its step for 10 minutes (@actions/cache's segment timer).
    SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
    # Chromium 143 can crash at launch (SIGSEGV in getenv) unless this is preset; see chromiumEnv in capture/chromium.mjs.
    FC_FONTATIONS: "1"

jobs:
    # The projects of visual-review.config.json, as the capture job's matrix.
    plan:
        name: Plan
        runs-on: ubuntu-24.04
        outputs:
            projects: ${{ steps.plan.outputs.projects }}
        steps:
            - uses: actions/checkout@v7
              with:
                  sparse-checkout: visual-review.config.json
                  sparse-checkout-cone-mode: false

            # A name in the `projects` input that is not a project stops the run here, rather than
            # capturing fewer projects than were asked for.
            - name: List the projects
              id: plan
              env:
                  WANT: ${{ inputs.projects }}
              run: |
                  projects=$(jq -c --arg want "$WANT" '(.baselines // "visual-baselines") as $b | (.fontconfig // null) as $f
                      | [$want | splits("[ ,]+") | select(. != "")] as $w
                      | [.projects | to_entries[] | {project: .key, storybook: .value.storybook,
                         build: .value.build, baselines: $b,
                         fonts: (if $f then ($f | sub("[^/]*$"; "")) + "**" else "\($b)/\(.key)/**" end)}] as $all
                      | ($w - [$all[].project]) as $unknown
                      | if ($unknown | length) > 0
                        then error("not a project: \($unknown | join(", "))")
                        else [$all[] | select(($w | length) == 0 or (.project | IN($w[])))] end' \
                      visual-review.config.json)
                  echo "projects=$projects" >> "$GITHUB_OUTPUT"

    # continue-on-error: a crash of the tool itself must not fail the run; the gate below judges.
    visual:
        name: visual (${{ matrix.project }})
        needs: plan
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            # To download the default branch's newest capture (the reference step below).
            actions: read
        continue-on-error: true
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.plan.outputs.projects) }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || inputs.ref }}

            # A pull request is captured at the head that was asked for: its merge's second parent.
            - name: Check the pull request is at the head asked for
              if: inputs.pr
              env:
                  PR: ${{ inputs.pr }}
                  WANT: ${{ inputs.ref }}
              run: |
                  head=$(git cat-file -p HEAD | sed -n 's/^parent //p' | sed -n 2p)
                  if [[ "$head" != "$WANT" ]]; then
                      echo "::error::pull request $PR is at ${head:-no merge}, not $WANT: ask for a capture of its new head"
                      exit 1
                  fi

            # Baseline PNGs are Git LFS objects. They are cached by the pointer files' hash, so a run
            # downloads from LFS only the images accepted since the cache was saved.
            - name: Restore this project's baseline images
              uses: actions/cache@v4
              with:
                  path: .git/lfs/objects
                  key: lfs-${{ matrix.project }}-${{ hashFiles(format('{0}/{1}/**/*.png', matrix.baselines, matrix.project), matrix.fonts) }}
                  restore-keys: lfs-${{ matrix.project }}-

            - name: Fetch this project's baseline images and the pinned fonts from Git LFS
              run: git lfs pull --include "${{ matrix.baselines }}/${{ matrix.project }}/**,${{ matrix.fonts }}"

            # __SETUP__

            # packages.microsoft.com, an apt source the hosted Ubuntu images ship and this job never
            # installs from, sometimes answers 403; apt-get update then fails install-browser.
            - name: Drop the Microsoft apt sources
              run: "{ grep -rl packages.microsoft.com /etc/apt/sources.list.d || true; } | xargs -r sudo rm -fv"

            - name: Install Chromium
              run: __CLI__ install-browser

            - name: Build Storybook
              if: matrix.build
              run: ${{ matrix.build }}

            # A story with no baseline that looks as it does in the default branch's newest capture is
            # "unseeded"; without a reference every one is "new". Both block until accepted or seeded.
            - name: Download the default branch's newest capture
              id: reference
              if: github.event_name != 'push'
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
              run: echo "dir=$(__CLI__ reference --project ${{ matrix.project }} --out "$RUNNER_TEMP/reference")" >> "$GITHUB_OUTPUT"

            # Shoots every story once and judges it at once against its baseline: a result line per
            # snapshot in the log, the images to review, results.json and junit.xml (one test case per
            # snapshot, for test-report and flaky-test tools) in the artifact. To shoot a snapshot that
            # did not pass once more before it counts, add --retries 1.
            - name: Capture and compare
              env:
                  STORIES: ${{ inputs.stories }}
              run: __CLI__ run --project ${{ matrix.project }} --out "$RUNNER_TEMP/visual" --reference "${{ steps.reference.outputs.dir }}" ${STORIES:+--stories "$STORIES"}

            # Kept when a snapshot did not pass or the tool crashed, so the reviewer sees what was judged.
            - name: Upload captures
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: visual-${{ matrix.project }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/visual/
                  retention-days: 30

            - name: Write the counts to the job summary
              if: always()
              run: |
                  f="$RUNNER_TEMP/visual/results.json"
                  {
                      echo "### Visual review (${{ matrix.project }})"
                      if [[ -f "$f" ]]; then
                          jq -r '"seeded: \(.seeded), complete: \(.complete), \(.items | length) of \(.expected) items, reference run: \(.reference)",
                              "", "| status | items |", "|---|---|",
                              (.items | group_by(.status)[] | "| \(.[0].status) | \(length) |")' "$f"
                      else
                          echo "No results.json: capture did not start."
                      fi
                  } >> "$GITHUB_STEP_SUMMARY"

    # Fails while a project of the base branch's or the pull request's config, or with baselines on
    # the base branch (seeded or not), holds anything but unchanged or excluded items in its newest
    # capture, or baselines whose git tree differs from the base branch's without the owner's
    # approval of exactly that tree, made at a commit in the pull request's history. Once
    # visual-review/passkeys.json on the base branch holds a key, that approval must carry a passkey
    # signature by one of the base branch's keys.
    # It runs the published gate at a pinned version, so a pull request's own dependencies cannot
    # change it. Full history (fetch-depth 0, blobs on demand): the approval's commit must be an
    # ancestor of the merge commit, and HEAD^1, the merge commit's first parent, is the base branch tip.
    # Where the gate's trust comes from: GitHub runs a pull request's own copy of this file, so a pull
    # request can change the pinned version or drop this job, and no check inside the gate can see
    # that. Protect it outside the gate: run this workflow from the default branch as a ruleset's
    # required workflow, or have code owners review every change to .github/ with "Visual gate" a
    # required check. The gate also warns when this file, the passkey list or
    # visual-review.config.json changes.
    visual-gate:
        name: Visual gate
        needs: visual
        if: always() && github.event_name == 'pull_request'
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  filter: blob:none

            - name: Download visual captures
              continue-on-error: true
              uses: actions/download-artifact@v8
              with:
                  pattern: visual-*
                  path: ${{ runner.temp }}/visual

            - name: Check visual changes were accepted
              run: npx --yes proofroom@__VERSION__ gate --captures "$RUNNER_TEMP/visual" --pr "${{ github.event.pull_request.number }}" --base HEAD^1 --head HEAD
