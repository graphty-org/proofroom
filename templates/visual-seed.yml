# Generated by visual-review init (@graphty/visual-review). `visual-review init --force` rewrites
# this file; change visual-review.config.json rather than this file where you can.
#
# Captures the Storybooks of an older, known-good commit with the default branch's capture tool, so
# baselines can be seeded from it: `visual-review serve --master-run <this run's id>` lists the run
# as the default branch, and Finish opens the seed pull request. Dispatch it from __BRANCH__:
#   gh workflow run visual-seed.yml --ref __BRANCH__ -f ref=<sha>
# Only the projects whose "seedFromDefaultBranch" is not false are captured, or, with
# `-f projects="a b"`, only those of them named there. Each project is built and captured on its
# own: one whose Storybook fails to build at that commit fails its own jobs and no other project's.
# The capture job repeats the "visual" job of the review workflow, except that it has no reference
# (every story without a baseline is "new") and results.json names the captured commit.

name: Visual seed capture

on:
    workflow_dispatch:
        inputs:
            ref:
                description: "The commit (or branch or tag) whose Storybooks are captured"
                required: true
                type: string
            projects:
                description: "The projects to capture, separated by spaces or commas (default: every one seeded from the default branch)"
                required: false
                type: string
                default: ""

permissions:
    contents: read

jobs:
    plan:
        name: Plan
        runs-on: ubuntu-24.04
        outputs:
            projects: ${{ steps.plan.outputs.projects }}
        steps:
            - uses: actions/checkout@v4
              with:
                  sparse-checkout: visual-review.config.json
                  sparse-checkout-cone-mode: false

            # A name that is not a project seeded from the default branch stops the run here, rather
            # than seeding fewer projects than were asked for.
            - name: List the projects
              id: plan
              env:
                  WANT: ${{ inputs.projects }}
              run: |
                  projects=$(jq -c --arg want "$WANT" '(.baselines // "visual-baselines") as $b | (.fontconfig // null) as $f
                      | [$want | splits("[ ,]+") | select(. != "")] as $w
                      | [.projects | to_entries[] | select(.value.seedFromDefaultBranch != false)
                         | {project: .key, storybook: .value.storybook, build: .value.build, baselines: $b,
                         fonts: (if $f then ($f | sub("[^/]*$"; "")) + "**" else "\($b)/\(.key)/**" end)}] as $all
                      | ($w - [$all[].project]) as $unknown
                      | if ($unknown | length) > 0
                        then error("not a project seeded from the default branch: \($unknown | join(", "))")
                        else [$all[] | select(($w | length) == 0 or (.project | IN($w[])))] end' \
                      visual-review.config.json)
                  echo "projects=$projects" >> "$GITHUB_OUTPUT"

    storybook:
        name: Build ${{ matrix.project }} at ${{ inputs.ref }}
        needs: plan
        runs-on: ubuntu-24.04
        outputs:
            sha: ${{ steps.sha.outputs.sha }}
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.plan.outputs.projects) }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref }}

            - name: Resolve the commit
              id: sha
              run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            # __SETUP__

            - name: Build Storybook
              run: ${{ matrix.build }}

            - uses: actions/upload-artifact@v4
              with:
                  name: storybook-${{ matrix.project }}
                  path: ${{ matrix.storybook }}/

    # Runs even when another project's build failed. A project whose own build failed has no
    # Storybook artifact, so its job stops at the download, before installing anything.
    visual:
        name: visual (${{ matrix.project }})
        needs: [plan, storybook]
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.plan.outputs.projects) }}
        steps:
            # The default branch's checkout: the capture tool, the config and the baselines come from here.
            - uses: actions/checkout@v4

            - name: Download Storybook build
              uses: actions/download-artifact@v4
              with:
                  name: storybook-${{ matrix.project }}
                  path: ${{ matrix.storybook }}/

            - name: Restore this project's baseline images
              uses: actions/cache@v4
              with:
                  path: .git/lfs/objects
                  key: lfs-${{ matrix.project }}-${{ hashFiles(format('{0}/{1}/**/*.png', matrix.baselines, matrix.project), matrix.fonts) }}
                  restore-keys: lfs-${{ matrix.project }}-

            - name: Fetch this project's baseline images and the pinned fonts from Git LFS
              run: git lfs pull --include "${{ matrix.baselines }}/${{ matrix.project }}/**,${{ matrix.fonts }}"

            # __SETUP__

            - name: Install Chromium
              run: __CLI__ install-browser

            - name: Capture
              run: __CLI__ capture --project ${{ matrix.project }} --out "$RUNNER_TEMP/visual"

            # capture takes the commit from GITHUB_SHA, the default branch's here; a seed Finish branches
            # from results.json's commit, so it must name the commit whose Storybook was captured.
            - name: Record the captured commit
              if: always()
              env:
                  SHA: ${{ needs.storybook.outputs.sha }}
              run: |
                  f="$RUNNER_TEMP/visual/results.json"
                  if [[ -f "$f" ]]; then
                      jq --arg sha "$SHA" '.commit = $sha' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
                  fi

            - name: Upload captures
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: visual-${{ matrix.project }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/visual/
                  retention-days: 30

            - name: Write the counts to the job summary
              if: always()
              run: |
                  f="$RUNNER_TEMP/visual/results.json"
                  {
                      echo "### Visual seed capture (${{ matrix.project }}) at ${{ needs.storybook.outputs.sha }}"
                      if [[ -f "$f" ]]; then
                          jq -r '"complete: \(.complete), \(.items | length) of \(.expected) items",
                              "", "| status | items |", "|---|---|",
                              (.items | group_by(.status)[] | "| \(.[0].status) | \(length) |")' "$f"
                      else
                          echo "No results.json: capture did not start."
                      fi
                  } >> "$GITHUB_STEP_SUMMARY"
