# The full check, on every pull request and every push to main: lint (ESLint and the TypeScript
# type check) and the tests (the Node tests, the Playwright page tests, and the published-files
# check), on each supported Node version. The tests need git and git-lfs, which the runner has.
name: CI

on:
    pull_request:
    push:
        branches: [main]
    workflow_call:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    check:
        name: Check (Node ${{ matrix.node }})
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                node: [22, 24]
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - run: npm ci

            - run: npx playwright install --with-deps chromium webkit

            - run: npm run lint

            - run: npm test

            - name: Upload test results
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: test-results-node-${{ matrix.node }}
                  path: test-results/
                  if-no-files-found: ignore
